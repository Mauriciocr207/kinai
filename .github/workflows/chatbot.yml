name: chatbot-check

on:
  pull_request:
    paths:
      - 'apps/chatbot/**'
      - '.github/workflows/chatbot.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/chatbot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/chatbot/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
