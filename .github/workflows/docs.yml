name: docs-check

on:
  pull_request:
    paths:
      - '**.md'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links and repository references
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f CONTRIBUTING.md
          rg -n "thesis-mayan-ai|mayan-asr-chatbot" README.md docs apps projects || true
